[package]
name = "portlens"
version = "0.4.1"
description = "PortLens — 端口服务监听 / 健康检查 / 启停 / 应用内多标签页面浏览"
authors = ["you"]
edition = "2021"

[lib]
# Windows 上 lib 名与 bin 名必须不同（rust-lang/cargo#8519）。
name = "portlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 可执行文件显示名：PortLens.exe（cargo package name 不允许大写）。
[[bin]]
name = "PortLens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：多 WebView（应用内多标签页面浏览）所需的 Window::add_child。
# 已核对本地缓存：tauri-runtime-wry 的 unstable feature 为空列表，不引入新 crate。
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
parking_lot = "0.12"
tracing = "0.1"
# 日志文件的流式解码（GBK/GB18030、UTF-16、Shift_JIS 等中文/日语日志常见编码）。
# 与 LogLens 同一份实现（WHATWG Encoding 标准），纯 Rust、无 C 依赖，版本为 tauri 传递依赖的同一版本。
encoding_rs = "0.8"
# 页面标签的请求头注入：WebView2 的 WebResourceRequested / WebResourceResponseReceived。
# 与 wry 的传递依赖同版本（0.39）；windows-core 0.62 提供 PCWSTR/PWSTR/HSTRING，不引入新的编译树。
webview2-com = "0.39"
windows-core = "0.62"
# 端口表枚举（IpHelper）、进程信息（ToolHelp/Threading）、KILL_ON_JOB_CLOSE 作业对象。
# 版本与 tauri 传递依赖一致，不会多编译一份。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false
